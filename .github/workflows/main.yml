name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'اسم التطبيق (يظهر تحت الأيقونة)'
        required: true
        default: 'Mahmoud chat'
      app_url:
        description: 'رابط موقعك على Netlify (يبدأ بـ https)'
        required: true
        default: 'https://harmonious-cheesecake-68491d.netlify.app'
      app_id:
        description: 'معرّف الحزمة (أحرف إنجليزية صغيرة ونقطتان على الأقل)'
        required: true
        default: 'com.mahmoud.chatapp'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_NAME: ${{ inputs.app_name }}
      APP_URL: ${{ inputs.app_url }}
      APP_ID: ${{ inputs.app_id }}
    steps:
      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/chatapp app/src/main/res/values app/src/main/res/drawable app/src/main/res/mipmap-xxxhdpi
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ChatApps"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.chatapp'
              compileSdk 34

              defaultConfig {
                  applicationId System.getenv('APP_ID')
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
                  resValue 'string', 'app_name', System.getenv('APP_NAME')
                  buildConfigField 'String', 'APP_URL', "\"" + System.getenv('APP_URL') + "\""
              }

              buildFeatures {
                  buildConfig true
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.microphone" android:required="false" />

              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:allowBackup="false"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden|keyboard|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">@android:color/white</item>
                  <item name="android:statusBarColor">@android:color/white</item>
                  <item name="android:navigationBarColor">@android:color/white</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:windowLightNavigationBar">true</item>
              </style>
          </resources>
          EOF
          cat > app/src/main/res/drawable/ic_notif.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M20,2H4C2.9,2 2,2.9 2,4v18l4,-4h14c1.1,0 2,-0.9 2,-2V4C22,2.9 21.1,2 20,2z" />
          </vector>
          EOF
          cat > app/src/main/java/com/chatapp/MainActivity.java <<'EOF'
          package com.chatapp;

          import android.Manifest;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.BitmapFactory;
          import android.media.AudioManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.JsResult;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {

              private static final int REQ_FILE = 101;
              private static final int REQ_START = 102;
              private static final int REQ_WEB = 103;
              private static final String CHANNEL = "messages";

              private WebView web;
              private ValueCallback<Uri[]> filePathCallback;
              private PermissionRequest pendingWebPermission;
              private AudioManager audio;
              private int prevAudioMode = AudioManager.MODE_NORMAL;
              private String appUrl;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  appUrl = BuildConfig.APP_URL;
                  audio = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                  createNotificationChannel();

                  web = new WebView(this);
                  setContentView(web);
                  configureWebView();
                  requestStartupPermissions();

                  String hash = hashFromIntent(getIntent());
                  web.loadUrl(appUrl + (hash != null ? "#" + hash : ""));
              }

              private void configureWebView() {
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  s.setSupportMultipleWindows(false);

                  web.addJavascriptInterface(new Bridge(), "NativeBridge");

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri u = request.getUrl();
                          String host = u.getHost();
                          String base = Uri.parse(appUrl).getHost();
                          if (host != null && base != null && (host.equals(base)
                                  || host.endsWith("firebaseapp.com")
                                  || host.endsWith("googleapis.com")
                                  || host.endsWith("gstatic.com"))) {
                              return false;
                          }
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, u));
                          } catch (Exception ignored) {
                          }
                          return true;
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> handleWebPermission(request));
                      }

                      @Override
                      public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (filePathCallback != null) {
                              filePathCallback.onReceiveValue(null);
                          }
                          filePathCallback = callback;
                          try {
                              startActivityForResult(params.createIntent(), REQ_FILE);
                          } catch (Exception e) {
                              filePathCallback = null;
                              callback.onReceiveValue(null);
                              return false;
                          }
                          return true;
                      }

                      @Override
                      public boolean onJsAlert(WebView view, String url, String message, final JsResult result) {
                          new AlertDialog.Builder(MainActivity.this)
                                  .setMessage(message)
                                  .setPositiveButton("حسناً", (d, w) -> result.confirm())
                                  .setOnCancelListener(d -> result.cancel())
                                  .show();
                          return true;
                      }

                      @Override
                      public boolean onJsConfirm(WebView view, String url, String message, final JsResult result) {
                          new AlertDialog.Builder(MainActivity.this)
                                  .setMessage(message)
                                  .setPositiveButton("موافق", (d, w) -> result.confirm())
                                  .setNegativeButton("إلغاء", (d, w) -> result.cancel())
                                  .setOnCancelListener(d -> result.cancel())
                                  .show();
                          return true;
                      }
                  });
              }

              /* ---------- الأذونات ---------- */

              private boolean has(String permission) {
                  return checkSelfPermission(permission) == PackageManager.PERMISSION_GRANTED;
              }

              private void requestStartupPermissions() {
                  List<String> need = new ArrayList<>();
                  if (!has(Manifest.permission.RECORD_AUDIO)) need.add(Manifest.permission.RECORD_AUDIO);
                  if (!has(Manifest.permission.CAMERA)) need.add(Manifest.permission.CAMERA);
                  if (Build.VERSION.SDK_INT >= 33 && !has(Manifest.permission.POST_NOTIFICATIONS)) {
                      need.add(Manifest.permission.POST_NOTIFICATIONS);
                  }
                  if (!need.isEmpty()) {
                      requestPermissions(need.toArray(new String[0]), REQ_START);
                  }
              }

              private void handleWebPermission(PermissionRequest request) {
                  String host = request.getOrigin() != null ? request.getOrigin().getHost() : null;
                  String base = Uri.parse(appUrl).getHost();
                  if (host == null || base == null || !host.equals(base)) {
                      request.deny();
                      return;
                  }
                  List<String> need = new ArrayList<>();
                  for (String r : request.getResources()) {
                      if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(r) && !has(Manifest.permission.RECORD_AUDIO)) {
                          need.add(Manifest.permission.RECORD_AUDIO);
                      }
                      if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(r) && !has(Manifest.permission.CAMERA)) {
                          need.add(Manifest.permission.CAMERA);
                      }
                  }
                  if (need.isEmpty()) {
                      request.grant(request.getResources());
                      return;
                  }
                  pendingWebPermission = request;
                  requestPermissions(need.toArray(new String[0]), REQ_WEB);
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == REQ_WEB && pendingWebPermission != null) {
                      boolean ok = grantResults.length > 0;
                      for (int r : grantResults) {
                          if (r != PackageManager.PERMISSION_GRANTED) ok = false;
                      }
                      if (ok) pendingWebPermission.grant(pendingWebPermission.getResources());
                      else pendingWebPermission.deny();
                      pendingWebPermission = null;
                  }
              }

              /* ---------- اختيار الملفات ---------- */

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == REQ_FILE) {
                      if (filePathCallback == null) return;
                      Uri[] results = WebChromeClient.FileChooserParams.parseResult(resultCode, data);
                      filePathCallback.onReceiveValue(results);
                      filePathCallback = null;
                      return;
                  }
                  super.onActivityResult(requestCode, resultCode, data);
              }

              /* ---------- الإشعارات والتنقل ---------- */

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel(CHANNEL, "الرسائل", NotificationManager.IMPORTANCE_HIGH);
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      if (nm != null) nm.createNotificationChannel(ch);
                  }
              }

              private String hashFromIntent(Intent intent) {
                  if (intent == null) return null;
                  String h = intent.getStringExtra("hash");
                  if (h != null && h.matches("[A-Za-z0-9/%_.~-]{1,300}")) return h;
                  return null;
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  String hash = hashFromIntent(intent);
                  if (hash != null && web != null) {
                      web.evaluateJavascript("location.hash='" + hash + "'", null);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (web != null && web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }

              @Override
              protected void onDestroy() {
                  if (web != null) {
                      setCallMode(false);
                      web.destroy();
                  }
                  super.onDestroy();
              }

              private void toast(final String msg) {
                  runOnUiThread(() -> Toast.makeText(MainActivity.this, msg, Toast.LENGTH_LONG).show());
              }

              /* ---------- الصوت: السماعة الأذنية أو المكبر ---------- */

              private boolean inCall = false;

              private void setCallMode(boolean on) {
                  if (audio == null) return;
                  if (on && !inCall) {
                      prevAudioMode = audio.getMode();
                      audio.setMode(AudioManager.MODE_IN_COMMUNICATION);
                      audio.setSpeakerphoneOn(false);
                      inCall = true;
                  } else if (!on && inCall) {
                      audio.setSpeakerphoneOn(false);
                      audio.setMode(prevAudioMode);
                      inCall = false;
                  }
              }

              /* ---------- حفظ الملفات في التنزيلات ---------- */

              private Uri saveToDownloads(String name, String mime, String b64) throws Exception {
                  byte[] bytes = Base64.decode(b64, Base64.DEFAULT);
                  String fname = (name == null || name.isEmpty()) ? "file" : name.replaceAll("[\\\\/:*?\"<>|]", "_");
                  String type = (mime == null || mime.isEmpty()) ? "application/octet-stream" : mime;
                  if (Build.VERSION.SDK_INT >= 29) {
                      ContentValues v = new ContentValues();
                      v.put(MediaStore.Downloads.DISPLAY_NAME, fname);
                      v.put(MediaStore.Downloads.MIME_TYPE, type);
                      v.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                      Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                      if (uri == null) throw new Exception("insert failed");
                      OutputStream os = getContentResolver().openOutputStream(uri);
                      if (os == null) throw new Exception("open failed");
                      try {
       
